<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Timer with Sound</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .timer-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h1 { color: #333; margin-top: 0; margin-bottom: 10px; }
        #display {
            font-size: 4rem;
            font-weight: bold;
            color: #222;
            margin: 20px 0;
            font-family: monospace;
        }
        #statusMessage {
            font-size: 0.95rem;
            font-weight: bold;
            color: #dc3545;
            height: 24px;
            margin-bottom: 10px;
        }
        .control-buttons, .modifier-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start { background-color: #28a745; color: white; width: 100px; }
        .pause { background-color: #ffc107; color: #333; width: 100px; }
        .reset { background-color: #dc3545; color: white; }
        .modifier-section h3 {
            font-size: 1rem;
            color: #666;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .add { background-color: #e3f2fd; color: #0d47a1; }
        .deduct { background-color: #ffebee; color: #b71c1c; }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="timer-container">
        <h1>Web Timer</h1>
        <div id="display">00:00</div>
        <div id="statusMessage"></div>

        <div class="control-buttons">
            <button id="startPauseBtn" class="btn start" onclick="toggleTimer()">Start</button>
            <button id="resetBtn" class="btn reset" onclick="resetTimer()">Reset</button>
        </div>

        <div class="modifier-section">
            <h3>Adjust Time</h3>
            <div class="modifier-row">
                <button class="btn add" onclick="adjustTime(10)">+10s</button>
                <button class="btn add" onclick="adjustTime(30)">+30s</button>
                <button class="btn add" onclick="adjustTime(60)">+1m</button>
            </div>
            <div class="modifier-row">
                <button class="btn deduct" onclick="adjustTime(-10)">-10s</button>
                <button class="btn deduct" onclick="adjustTime(-30)">-30s</button>
                <button class="btn deduct" onclick="adjustTime(-60)">-1m</button>
            </div>
        </div>
    </div>

    <script>
        let totalSeconds = 0;
        let timerInterval = null;
        let isRunning = false;
        let audioCtx = null;

        // Initialize Audio context safely upon first click interaction
        function initAudio() {
            if (!audioCtx) {
                audioCtx = new (window.AudioContext || window.webkitAudioContext)();
            }
        }

        // Helper function to synthesize custom tone frequencies 
        function playTone(frequency, duration, type = 'sine') {
            try {
                initAudio();
                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                
                osc.type = type;
                osc.frequency.value = frequency;
                
                // Smoothly fade out sound to prevent clicks/pops
                gain.gain.setValueAtTime(0.15, audioCtx.currentTime);
                gain.gain.exponentialRampToValueAtTime(0.0001, audioCtx.currentTime + duration);
                
                osc.connect(gain);
                gain.connect(audioCtx.destination);
                
                osc.start();
                osc.stop(audioCtx.currentTime + duration);
            } catch (e) {
                console.log("Audio play blocked or unsupported:", e);
            }
        }

        // Alarm sequence tone loop when timer completes
        function playAlarm() {
            let count = 0;
            const interval = setInterval(() => {
                if (count >= 3 || totalSeconds > 0) { 
                    clearInterval(interval); 
                    return; 
                }
                playTone(880, 0.15, 'square'); // Sharp alarm beep
                count++;
            }, 250);
        }

        function updateDisplay() {
            const displayElement = document.getElementById('display');
            if (displayElement) {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                displayElement.textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            }
        }

        function tick() {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateDisplay();
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                const startPauseBtn = document.getElementById('startPauseBtn');
                if (startPauseBtn) {
                    startPauseBtn.textContent = 'Start';
                    startPauseBtn.className = 'btn start';
                }
                const statusMessage = document.getElementById('statusMessage');
                if (statusMessage) {
                    statusMessage.textContent = "Time's up!";
                }
                playAlarm(); // Triggers the ending sound sequence
            }
        }

        function toggleTimer() {
            initAudio();
            const statusMessage = document.getElementById('statusMessage');
            if (statusMessage) statusMessage.textContent = "";
            
            const startPauseBtn = document.getElementById('startPauseBtn');

            if (isRunning) {
                clearInterval(timerInterval);
                if (startPauseBtn) {
                    startPauseBtn.textContent = 'Start';
                    startPauseBtn.className = 'btn start';
                }
            } else {
                if (totalSeconds === 0) {
                    if (statusMessage) statusMessage.textContent = "Please add some time first!";
                    return;
                }
                timerInterval = setInterval(tick, 1000);
                if (startPauseBtn) {
                    startPauseBtn.textContent = 'Pause';
                    startPauseBtn.className = 'btn pause';
                }
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            totalSeconds = 0;
            isRunning = false;
            
            const startPauseBtn = document.getElementById('startPauseBtn');
            if (startPauseBtn) {
                startPauseBtn.textContent = 'Start';
                startPauseBtn.className = 'btn start';
            }
            
            const statusMessage = document.getElementById('statusMessage');
            if (statusMessage) statusMessage.textContent = "";
            
            updateDisplay();
        }

        function adjustTime(amount) {
            initAudio();
            const statusMessage = document.getElementById('statusMessage');
            if (statusMessage) statusMessage.textContent = "";
            
            // Play sounds based on adding or deducting time
            if (amount > 0) {
                playTone(600, 0.08); // Sharp high pitch beep for addition
            } else if (amount < 0 && totalSeconds > 0) {
                playTone(300, 0.1);  // Lower pitch flat boop for deduction
            }

            totalSeconds += amount;
            if (totalSeconds < 0) totalSeconds = 0;
            updateDisplay();
        }

        updateDisplay();
    </script>
</body>
</html>
