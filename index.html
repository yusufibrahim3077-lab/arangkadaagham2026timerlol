<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Web Timer</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f0f2f5;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }
        .timer-container {
            background-color: #ffffff;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.1);
            text-align: center;
            width: 320px;
        }
        h1 { color: #333; margin-top: 0; margin-bottom: 10px; }
        #display {
            font-size: 4rem;
            font-weight: bold;
            color: #222;
            margin: 20px 0;
            font-family: monospace;
        }
        #statusMessage {
            font-size: 0.95rem;
            font-weight: bold;
            color: #dc3545;
            height: 24px;
            margin-bottom: 10px;
        }
        .control-buttons, .modifier-row {
            display: flex;
            justify-content: space-around;
            margin-bottom: 15px;
        }
        .btn {
            padding: 10px 20px;
            font-size: 1rem;
            font-weight: bold;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            transition: background 0.2s;
        }
        .start { background-color: #28a745; color: white; width: 100px; }
        .pause { background-color: #ffc107; color: #333; width: 100px; }
        .reset { background-color: #dc3545; color: white; }
        .modifier-section h3 {
            font-size: 1rem;
            color: #666;
            margin-top: 20px;
            margin-bottom: 10px;
        }
        .add { background-color: #e3f2fd; color: #0d47a1; }
        .deduct { background-color: #ffebee; color: #b71c1c; }
        .btn:hover { opacity: 0.85; }
    </style>
</head>
<body>

    <div class="timer-container">
        <h1>Web Timer</h1>
        <div id="display">00:00</div>
        <div id="statusMessage"></div>

        <div class="control-buttons">
            <!-- Added direct onclick actions to completely bypass loading state delays -->
            <button id="startPauseBtn" class="btn start" onclick="toggleTimer()">Start</button>
            <button id="resetBtn" class="btn reset" onclick="resetTimer()">Reset</button>
        </div>

        <div class="modifier-section">
            <h3>Adjust Time</h3>
            <div class="modifier-row">
                <button class="btn add" onclick="adjustTime(10)">+10s</button>
                <button class="btn add" onclick="adjustTime(30)">+30s</button>
                <button class="btn add" onclick="adjustTime(60)">+1m</button>
            </div>
            <div class="modifier-row">
                <button class="btn deduct" onclick="adjustTime(-10)">-10s</button>
                <button class="btn deduct" onclick="adjustTime(-30)">-30s</button>
                <button class="btn deduct" onclick="adjustTime(-60)">-1m</button>
            </div>
        </div>
    </div>

    <!-- Script block placed explicitly at the bottom of the body section -->
    <script>
        let totalSeconds = 0;
        let timerInterval = null;
        let isRunning = false;

        function updateDisplay() {
            const displayElement = document.getElementById('display');
            if (displayElement) {
                const minutes = Math.floor(totalSeconds / 60);
                const seconds = totalSeconds % 60;
                displayElement.textContent = String(minutes).padStart(2, '0') + ':' + String(seconds).padStart(2, '0');
            }
        }

        function tick() {
            if (totalSeconds > 0) {
                totalSeconds--;
                updateDisplay();
            } else {
                clearInterval(timerInterval);
                isRunning = false;
                const startPauseBtn = document.getElementById('startPauseBtn');
                if (startPauseBtn) {
                    startPauseBtn.textContent = 'Start';
                    startPauseBtn.className = 'btn start';
                }
                const statusMessage = document.getElementById('statusMessage');
                if (statusMessage) {
                    statusMessage.textContent = "Time's up!";
                }
            }
        }

        function toggleTimer() {
            const statusMessage = document.getElementById('statusMessage');
            if (statusMessage) statusMessage.textContent = "";
            
            const startPauseBtn = document.getElementById('startPauseBtn');

            if (isRunning) {
                clearInterval(timerInterval);
                if (startPauseBtn) {
                    startPauseBtn.textContent = 'Start';
                    startPauseBtn.className = 'btn start';
                }
            } else {
                if (totalSeconds === 0) {
                    if (statusMessage) statusMessage.textContent = "Please add some time first!";
                    return;
                }
                timerInterval = setInterval(tick, 1000);
                if (startPauseBtn) {
                    startPauseBtn.textContent = 'Pause';
                    startPauseBtn.className = 'btn pause';
                }
            }
            isRunning = !isRunning;
        }

        function resetTimer() {
            clearInterval(timerInterval);
            totalSeconds = 0;
            isRunning = false;
            
            const startPauseBtn = document.getElementById('startPauseBtn');
            if (startPauseBtn) {
                startPauseBtn.textContent = 'Start';
                startPauseBtn.className = 'btn start';
            }
            
            const statusMessage = document.getElementById('statusMessage');
            if (statusMessage) statusMessage.textContent = "";
            
            updateDisplay();
        }

        function adjustTime(amount) {
            const statusMessage = document.getElementById('statusMessage');
            if (statusMessage) statusMessage.textContent = "";
            
            totalSeconds += amount;
            if (totalSeconds < 0) totalSeconds = 0;
            updateDisplay();
        }

        // Run instantly upon source rendering
        updateDisplay();
    </script>
</body>
</html>
